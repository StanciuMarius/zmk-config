# Board targets use Zephyr hardware-model-v2 naming:
#   xiao_ble//zmk                     - Seeed XIAO nRF52840 in the keyboard halves
#   nrf52840_mdk_usb_dongle//zmk      - Makerdiary dongle (board defined in this repo)
include:
  # --- the dongle: BLE central + USB HID + ZMK Studio ---
  - board: nrf52840_mdk_usb_dongle//zmk
    shield: totem_dongle
    snippet: studio-rpc-usb-uart

  # --- the two halves: BLE peripherals, no keymap of their own ---
  - board: xiao_ble//zmk
    shield: totem_left
  - board: xiao_ble//zmk
    shield: totem_right

  # --- wipes stored BLE bonds; flash before the real firmware ---
  - board: xiao_ble//zmk
    shield: settings_reset
  - board: nrf52840_mdk_usb_dongle//zmk
    shield: settings_reset
