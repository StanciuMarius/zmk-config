# Dongle only. Applied after totem.conf, so it wins where they disagree.

# ZMK Studio, reachable over the dongle's USB connection. The
# studio-rpc-usb-uart snippet in build.yaml provides the transport.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y

# The dongle is mains-powered over USB and must stay connected to both halves,
# so it must never sleep.
CONFIG_ZMK_SLEEP=n

# Prefer USB HID over BLE for talking to the host.
CONFIG_ZMK_USB=y
